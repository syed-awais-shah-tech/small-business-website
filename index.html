<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awais Laptop Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero">
        <h1>Awais Laptop Shop</h1>
        <p>Laptops and accessories for everyone.</p>
    </header>

    <main>
        <section>
            <h2>Our Services</h2>
            <p>Explore laptops, keyboards and computer accessories.</p>
        </section>

        <section>
            <h2>Contact Us</h2>
            <form id="contact-form">
                <label for="name">Your name</label>
                <input id="name" name="name" required>

                <label for="email">Email address</label>
                <input id="email" name="email" type="email" required>

                <label for="message">Your message</label>
                <textarea id="message" name="message" required minlength="5"></textarea>

                <button type="submit">Send Message</button>
            </form>
            <p id="form-message" aria-live="polite"></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
